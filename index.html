<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Remote Control</title>
<style>
body{
    font-family:Arial;
    text-align:center;
    background:#222;
    color:white;
}
button{
    width:200px;
    height:60px;
    margin:10px;
    font-size:20px;
}
</style>
</head>
<body>

<h2>Remote HP</h2>

<button onclick="kirim('play')">PLAY</button><br>
<button onclick="kirim('pause')">PAUSE</button><br>
<button onclick="kirim('volumeup')">Volume +</button><br>
<button onclick="kirim('volumedown')">Volume -</button>

<script>
function kirim(cmd){
    fetch("http://IP_HP_TUJUAN:5000/control",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({command:cmd})
    }).then(()=>{
        alert("Perintah dikirim: "+cmd);
    });
}
</script>

</body>
</html>
